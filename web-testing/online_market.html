<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Магазин</title>
  <style>
    body {
      font-family: sans-serif;
      background-color: #f4f4f7;
      padding: 20px;
    }
    .controls {
      display: flex;
      gap: 15px;
      align-items: center;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }
    .search-input {
      width: 100%;
      max-width: 400px;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }
    .sort-select {
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      background: white;
      cursor: pointer;
    }
    .reset-btn {
      padding: 12px 20px;
      border: 1px solid #007bff;
      background-color: transparent;
      color: #007bff;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .reset-btn:hover {
      background-color: #007bff;
      color: white;
    }
    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }
    .product {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .product img {
      width: 100%;
      height: 150px;
      object-fit: contain; 
      margin-bottom: 15px;
    }
    .product h3 {
      font-size: 16px;
      margin: 10px 0;
      height: 40px; 
      overflow: hidden;
    }
    .product p {
      font-weight: bold;
      color: #2b2b2b;
    }
    .product button {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
      margin-top: auto; 
      transition: background 0.2s;
    }
    .product button:hover {
      background-color: #0056b3;
    }

    /* Ошибка загрузки */
    .error-message {
      grid-column: 1 / -1; 
      text-align: center; 
      padding: 40px; 
      background-color: #fff3f3; 
      border: 1px solid #f5c2c2; 
      border-radius: 12px; 
      color: #721c24;
    }
    .error-icon {
      font-size: 40px;
      display: block;
      margin-bottom: 10px;
    }
    .error-title {
      margin: 0 0 10px 0;
      font-size: 20px;
    }
    .error-text {
      margin: 0;
      color: #54141a;
    }
    .error-btn {
      margin-top: 15px; 
      background-color: #dc3545; 
      color: white; 
      border: none; 
      padding: 8px 16px; 
      border-radius: 6px; 
      cursor: pointer;
      transition: background 0.2s;
    }
    .error-btn:hover {
      background-color: #bd2130;
    }

    /* Элементы корзины */
    .cart-container {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
      max-width: 600px;
      margin: 0 auto;
    }
    .cart-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #eee;
      padding-bottom: 10px;
      margin-bottom: 15px;
    }
    .cart-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 18px;
      font-weight: bold;
    }
    .clear-cart-btn {
      background: none;
      border: none;
      color: #888;
      font-size: 13px;
      cursor: pointer;
      text-decoration: underline;
    }
    .clear-cart-btn:hover {
      color: #dc3545;
    }
    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #eee;
    }
    .cart-item-title {
      font-size: 14px;
      display: block;
      margin-bottom: 5px;
    }
    .cart-item-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .cart-item-quantity {
      font-weight: bold;
      min-width: 20px;
      text-align: center;
    }
    .cart-btn {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .cart-btn:hover {
      background-color: #0056b3;
    }
    .cart-delete-btn {
      background: none;
      border: none;
      color: #dc3545;
      cursor: pointer;
      font-weight: bold;
      font-size: 16px;
      margin-left: 6px;
      padding: 2px 6px;
      border-radius: 4px;
      transition: background 0.2s;
    }
    .cart-delete-btn:hover {
      background-color: #fff0f0;
    }
    .cart-item-price {
      font-weight: bold;
      font-size: 14px;
      margin-left: 10px;
    }
    .cart-total {
      margin-top: 15px;
      text-align: right;
      font-size: 18px;
      font-weight: bold;
    }
  </style>
</head>
<body>

<div class="controls">
  <input type="text" class="search-input" placeholder="Поиск товара" />
  
  <select class="sort-select">
    <option value="default">По умолчанию</option>
    <option value="cheap">Сначала дешевые</option>
    <option value="expensive">Сначала дорогие</option>
  </select>

  <button class="reset-btn">Сбросить фильтры</button>
</div>

<div class="products"></div>
<div class="cart-container"></div>

<script>
// Глобальное состояние (State)
let products = [];
let cart = [];
let originalProducts = [];

let searchQuery = "";
let sortType = "default";

const productsSearch = document.querySelector(".search-input");
const productsList = document.querySelector(".products");
const sortSelect = document.querySelector(".sort-select");
const resetBtn = document.querySelector(".reset-btn");
const cartContainer = document.querySelector(".cart-container"); 

// Главный конвейер фильтрации и сортировки
function updateProducts() { 
    let result = [...originalProducts];

    // Поиск
    if (searchQuery) {
        result = result.filter(product => 
            product.title.toLowerCase().includes(searchQuery)
        );
    }

    // Сортировка
    if (sortType === "cheap") {
        result.sort((a, b) => a.price - b.price);
    } else if (sortType === "expensive") {
        result.sort((a, b) => b.price - a.price); 
    }

    products = result;
    render(products);
}

// Загрузка корзины из LocalStorage (с валидацией от "битых" данных)
function loadCart() {
    try {
        const localData = localStorage.getItem("cart");
        if (localData !== null) {
            const parsed = JSON.parse(localData);
            // Валидация: проверяем, что все элементы массивы содержат валидную цену и заголовок
            if (Array.isArray(parsed) && parsed.every(item => item && item.title && !isNaN(item.price))) {
                cart = parsed;
            } else {
                cart = [];
                localStorage.removeItem("cart");
            }
        } else {
            cart = [];
        }
    } catch (e) {
        cart = [];
        localStorage.removeItem("cart");
    }
}

// Загрузка товаров с сервера
async function loadProducts() { 
    try {
        const response = await fetch("https://fakestoreapi.com/products");
        if (!response.ok) {
            throw new Error(`Ошибка сервера: ${response.status}`);
        }
        const data = await response.json();
        originalProducts = data;
        updateProducts();
    } catch (error) {
        console.log(error.message);

        productsList.innerHTML = `
            <div class="error-message">
                <span class="error-icon">⚠️</span>
                <h3 class="error-title">Не удалось загрузить товары</h3>
                <p class="error-text">Попробуйте обновить страницу или зайти позже.</p>
                <button class="error-btn" onclick="window.location.reload()">Обновить страницу</button>
            </div>
        `;
    }
}

// Инициализация приложения
async function init() {
    loadCart();
    renderCart(cart); 
    await loadProducts();
}

// Подсчет суммы 
function cartTotalSum(array) {
    return array.reduce((acc, item) => acc + (item.price * item.quantity), 0);
}

// Сохранение корзины 
function saveAndRenderCart(cartArray) {
    localStorage.setItem("cart", JSON.stringify(cartArray));
    renderCart(cartArray);
}

// Отрисовка корзины
function renderCart(cartArray) {
    const itemsHTML = cartArray 
        .map(item => `
          <div class="cart-item">
            <div class="cart-item-info">
              <span class="cart-item-title">${item.title}</span>
              <div class="cart-item-controls">
                <button class="cart-btn" data-id="${item.id}" data-action="decrement">-</button>
                <span class="cart-item-quantity">${item.quantity}</span>
                <button class="cart-btn" data-id="${item.id}" data-action="increment">+</button>
                <button class="cart-delete-btn" data-id="${item.id}" data-action="delete" title="Удалить позицию">✕</button>
              </div>
            </div>
            <div class="cart-item-price">
              $${(item.price * item.quantity).toFixed(2)}
            </div>
          </div>
        `)
        .join("");

    const total = cartTotalSum(cartArray);

    cartContainer.innerHTML = `
        <div class="cart-header">
          <div class="cart-title">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="9" cy="21" r="1"></circle>
              <circle cx="20" cy="21" r="1"></circle>
              <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
            </svg>
            <span>Корзина</span>
          </div>
          ${cartArray.length > 0 ? `<button class="clear-cart-btn" data-action="clear-all">Очистить всё</button>` : ""}
        </div>
        <div class="cart-body">
          ${itemsHTML || "<p>Корзина пуста</p>"}
        </div>
        ${cartArray.length > 0 ? `<div class="cart-total">Итого: $${total.toFixed(2)}</div>` : ""}
    `;
}

// Отрисовка каталога
function render(productsArray) {
    const updatedProducts = productsArray
        .map(product => `
          <div class="product">
            <img src="${product.image}" alt="${product.title}">
            <h3>${product.title}</h3>
            <p>$${product.price}</p>
            <button data-id="${product.id}">Добавить в корзину</button>
          </div>
        `)
        .join("");

    productsList.innerHTML = updatedProducts;
}

// --- Слушатели событий (Event Listeners) ---

// Живой поиск
productsSearch.addEventListener("input", () => {
    searchQuery = productsSearch.value.trim().toLowerCase();
    updateProducts();
});

// Смена сортировки
sortSelect.addEventListener("change", (event) => {
    sortType = event.target.value;
    updateProducts();
}); 

// Сброс всех фильтров
resetBtn.addEventListener("click", () => {
    searchQuery = "";
    sortType = "default";
    productsSearch.value = "";
    sortSelect.value = "default";
    updateProducts();
});

// Добавление в корзину 
productsList.addEventListener("click", (event) => {
    if (!event.target.matches("button")) return;

    let id = Number(event.target.dataset.id);
    const product = originalProducts.find(p => p.id === id);
    if (!product) return; // Защита от кликов до загрузки товаров

    const cartItem = cart.find(p => p.id === id);

    if (cartItem) {
        cartItem.quantity++; 
    } else {
        cart.push({ ...product, quantity: 1 });
    }

    saveAndRenderCart(cart); 
});

// Управление количеством / Удаление / Очистка корзины 
cartContainer.addEventListener("click", (event) => {
    const button = event.target.closest("[data-action]");
    if (!button) return;

    const action = button.dataset.action;

    if (action === "clear-all") {
        cart = [];
        saveAndRenderCart(cart);
        return;
    }

    const cartID = Number(button.dataset.id);

    if (action === "increment") {
        cart = cart.map(item => 
            item.id === cartID ? { ...item, quantity: item.quantity + 1 } : item
        );
    } else if (action === "decrement") {
        cart = cart
            .map(item => item.id === cartID ? { ...item, quantity: item.quantity - 1 } : item)
            .filter(item => item.quantity > 0);
    } else if (action === "delete") {
        cart = cart.filter(item => item.id !== cartID);
    }

    saveAndRenderCart(cart); 
});

init();
</script>

</body>
</html>
